[project]
name = "sarthi"
version = "0.1.0"
description = "Sarthi agentic inventory backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "openai>=3.26.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.0",
    "statsforecast>=2.0.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
sarthi = "sarthi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarthi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff.lint.per-file-ignores]
# The validator must survive any failure inside a check and report it, so broad catches are intended.
"src/sarthi/validate.py" = ["BLE001"]
